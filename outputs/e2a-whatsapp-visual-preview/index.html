<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VOYARA E.2A — WhatsApp CRM Visual Preview</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f4ede0; color: #1b1b1b; margin: 0; padding: 32px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #6b6455; margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin-top: 24px; }
  figure { margin: 0; background: white; border: 1px solid #e2d9c8; border-radius: 10px; overflow: hidden; }
  figcaption { padding: 10px 14px; font-size: 0.85rem; font-weight: 600; border-top: 1px solid #e2d9c8; }
  img { width: 100%; display: block; }
</style>
</head>
<body>
  <h1>VOYARA E.2A — WhatsApp CRM Visual Preview</h1>
  <p class="sub">Internal, server-flag-gated preview (<code>VOYARA_INTERNAL_PREVIEW_ENABLED=true</code>). Not production data.</p>
  <div class="grid">
    <figure><img src="en-desktop-ready.png" alt="EN desktop ready state" /><figcaption>EN · Desktop 1440px · Ready</figcaption></figure>
    <figure><img src="en-desktop-converted.png" alt="EN desktop converted state" /><figcaption>EN · Desktop 1440px · Converted</figcaption></figure>
    <figure><img src="en-desktop-denied.png" alt="EN desktop denied state" /><figcaption>EN · Desktop 1440px · Denied</figcaption></figure>
    <figure><img src="az-mobile-ready.png" alt="AZ mobile ready state" /><figcaption>AZ · Mobile 390px · Ready</figcaption></figure>
    <figure><img src="ru-mobile-waiting.png" alt="RU mobile waiting state" /><figcaption>RU · Mobile 390px · Waiting</figcaption></figure>
  </div>
</body>
</html>
